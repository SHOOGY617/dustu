<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUSTU // GUEST PILOT</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background: #050505; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Video Container */
        .viewport { width: 100%; height: 50vh; background: #000; border-bottom: 2px solid #333; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Controls Area */
        .controls { padding: 20px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        /* Joystick */
        .d-pad { display: grid; grid-template-columns: 70px 70px 70px; gap: 10px; margin-top: 20px; }
        .btn { width: 70px; height: 70px; background: #111; border: 1px solid #0f0; color: #0f0; font-size: 24px; cursor: pointer; border-radius: 10px; }
        .btn:active { background: #0f0; color: #000; }
        
        /* Disabled State (When Admin takes over) */
        .locked { opacity: 0.3; pointer-events: none; filter: grayscale(100%); }
        
        #status-msg { margin-top: 15px; color: #666; font-size: 12px; }
        .blink-red { color: red; animation: blink 1s infinite; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="viewport">
        <iframe 
    src="https://vdo.ninja/?room=dustu_cam_01&view=robot_eyes&cleanoutput&autoplay&audiocontrols=0" 
    allow="autoplay; camera;">
</iframe>
    </div>

    <div id="control-deck" class="controls">
        <div id="status-msg">SYSTEM: ONLINE // WAITING FOR INPUT</div>
        
        <div class="d-pad">
            <div></div>
            <button class="btn" onmousedown="move('F')" onmouseup="move('S')">▲</button>
            <div></div>
            <button class="btn" onmousedown="move('L')" onmouseup="move('S')">◄</button>
            <button class="btn" onmousedown="move('B')" onmouseup="move('S')">▼</button>
            <button class="btn" onmousedown="move('R')" onmouseup="move('S')">►</button>
        </div>
        
        <div style="margin-top: 20px; color: #444; font-size: 10px;">
            GUEST ACCESS LEVEL: LIMITED<br>
            NO LID CONTROL / NO AUDIO
        </div>
    </div>

    <script>
        const mqtt_broker = 'wss://broker.emqx.io:8084/mqtt'; 
        const topic_pub = 'dustu/control';
        const topic_system = 'dustu/system/access'; // Channel for Lock commands
        
        let client = mqtt.connect(mqtt_broker);
        const deck = document.getElementById('control-deck');
        const status = document.getElementById('status-msg');

        client.on('connect', () => {
            console.log("Guest Connected");
            client.subscribe(topic_system); // Listen for Admin commands
        });

        client.on('message', (topic, message) => {
            const msg = message.toString();
            
            // ADMIN OVERRIDE LOGIC
            if (topic === topic_system) {
                if (msg === "LOCKED") {
                    deck.classList.add("locked"); // Disable buttons
                    status.innerHTML = "⚠ OVERRIDE ACTIVE: ADMIN HAS CONTROL";
                    status.classList.add("blink-red");
                } else if (msg === "OPEN") {
                    deck.classList.remove("locked"); // Enable buttons
                    status.innerHTML = "SYSTEM: ONLINE // CONTROL RETURNED";
                    status.classList.remove("blink-red");
                }
            }
        });

        function move(dir) {
            client.publish(topic_pub, dir);
        }
    </script>
</body>
</html>
